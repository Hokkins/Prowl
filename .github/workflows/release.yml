# Builds self-contained Editor binaries for every supported platform and publishes them as a
# GitHub Release, triggered by pushing a version tag (e.g. `v1.0-preview`, `v1.2.3`).
#
# Prowl.Editor.csproj supports two modes for the Anthology libraries (Ember, Origami, Graphite,
# Photonic, Rosetta, Unwrapper):
#   - '$(ProwlLocalAnthology)' == 'true'  -> build from the Anthology sources
#   - otherwise                           -> consume NuGet packages
# The `Prowl.Graphite.Debugger.Viewer` package is not on nuget.org, so we build everything
# from the Anthology sources: check the repo out and pass `-p:ProwlLocalAnthology=true`.

name: Release

"on":
  push:
    tags:
      - 'v*'

env:
  # ⚠️ VERIFY these values against the real Anthology repository used by Prowl Engine.
  # If the Anthology repo is private, you must also add a PAT with `repo` scope as
  # a repository secret (e.g. ANTHOLOGY_TOKEN) and uncomment the `token:` line below.
  ANTHOLOGY_REPO: ProwlEngine/Anthology
  ANTHOLOGY_REF: main

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, linux-x64, linux-arm64, osx-x64, osx-arm64]

    steps:
      - name: Checkout Prowl
        uses: actions/checkout@v4

      # Prowl.Editor.csproj resolves Anthology projects at paths like
      #   $(AnthologyDir)Graphite\Debugger\Viewer\Prowl.Graphite.Debugger.Viewer.csproj
      # so we check the repo out at a known location and point AnthologyDir at it.
      - name: Checkout Anthology
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ANTHOLOGY_REPO }}
          ref: ${{ env.ANTHOLOGY_REF }}
          path: _anthology
          # token: ${{ secrets.ANTHOLOGY_TOKEN }}   # uncomment for a private Anthology repo

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Publish (${{ matrix.runtime }})
        run: >
          dotnet publish ./Prowl.Editor/Prowl.Editor.csproj
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained true
          --output ./publish/${{ matrix.runtime }}/Prowl
          -p:ProwlLocalAnthology=true
          -p:AnthologyDir=${{ github.workspace }}/_anthology/

      # macOS ships as a real Prowl.app bundle, not a bare folder. Not code-signed/notarized:
      # Gatekeeper still warns "unidentified developer" until the user right-clicks Open.
      - name: Bundle macOS .app (${{ matrix.runtime }})
        if: startsWith(matrix.runtime, 'osx-')
        run: |
          set -e
          PUB="./publish/${{ matrix.runtime }}/Prowl"
          APP="./publish/${{ matrix.runtime }}/Prowl.app"
          mkdir -p "$APP/Contents/MacOS"
          mv "$PUB"/* "$APP/Contents/MacOS/"
          rmdir "$PUB"
          chmod +x "$APP/Contents/MacOS/Prowl.Editor"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key><string>Prowl</string>
              <key>CFBundleDisplayName</key><string>Prowl Editor</string>
              <key>CFBundleExecutable</key><string>Prowl.Editor</string>
              <key>CFBundleIdentifier</key><string>com.prowlengine.editor</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
              <key>CFBundleVersion</key><string>${{ github.ref_name }}</string>
              <key>CFBundleShortVersionString</key><string>${{ github.ref_name }}</string>
              <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

      - name: Zip
        run: |
          cd ./publish/${{ matrix.runtime }}
          if [ -d "Prowl.app" ]; then
            zip -r "../../Prowl-${{ github.ref_name }}-${{ matrix.runtime }}.zip" Prowl.app
          else
            zip -r "../../Prowl-${{ github.ref_name }}-${{ matrix.runtime }}.zip" Prowl
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Prowl-${{ matrix.runtime }}
          path: Prowl-${{ github.ref_name }}-${{ matrix.runtime }}.zip
          retention-days: 5

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'preview') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
